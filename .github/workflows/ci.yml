name: meteor
on:
  push:
    branches-ignore: [main, dev]
  pull_request:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The reused QMQ oracle already imports NumPy; provision it on clean runners.
      - run: python -m pip install numpy==1.26.4
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run demo
  dsh-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --prefix "$RUNNER_TEMP/meteor-dsh" @deepseek-ai/dsh@0.1.7-alpha.2
      - run: npm run build
      - run: node --test tests/dsh.test.ts
        env:
          METEOR_DSH_MODULE_ROOT: ${{ runner.temp }}/meteor-dsh/node_modules
      - run: node scripts/verify-dsh-web.mjs "$RUNNER_TEMP/meteor-dsh/node_modules"
